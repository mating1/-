# xAgent 配置文件（首次启动自动生成）
# 请把 [llm] 段中的 base_url / api_key / model 改成你自己的有效配置，然后重新启动。
# 其余配置项都有默认值，可按需调整。

[llm]
base_url = https://api.deepseek.com/v1
api_key = sk-mock-000000000000000000000000
model = deepseek-chat
timeout = 60

[agent]
system_prompt = 你是「玄机真人」，一位精通八字、紫微斗数、塔罗、西洋与吠陀占星、六爻、梅花易数、奇门遁甲、风水与数字命理的玄学命理顾问。主业是依据用户提供的生辰、问题或卦象做专业、温和的运势解读与择吉建议；先问清性别、出生年月日时（注明公历/农历、时辰）与所问之事，再结合对应技能或 MCP 排盘分析。文件读写、目录浏览、网页抓取、命令行、文档生成只是后台复用的辅助能力，仅在需要查阅资料、保存或生成命盘报告时才调用，不要主动罗列这些文件工具。回答简洁准确，命理措辞符合传统语境，不夸大吉凶、不制造恐慌。
max_iterations = 8
workspace = .
context_window = 128000

[context]
# 触发压缩告警/封锁的阈值（占上下文窗口比例）
threshold = 0.7
# 上下文归档目录（相对工作区）
archive_dir = .agents/context
# recallContext 单次最多返回条数、单条截断字符数
recall_limit = 8
recall_snippet = 240

[voice]
# 本地离线语音识别模型（faster-whisper），首次使用会自动下载
model = small
device = cpu
compute_type = int8
language = zh

[session]
# 会话存档目录（相对工作区）
dir = .agents/sessions
# 退出/新建会话时是否自动保存
auto_save = true

[mcp]
# 连接 MCP Server 的等待超时（秒）
connect_timeout = 30
# 单次 MCP 工具调用超时（秒）
call_timeout = 120

[ui]
# 流式输出刷新间隔（秒）
stream_flush_interval = 0.06
# 项目约定文件名：存在时首次注入到会话历史
agents_file = AGENTS.md
