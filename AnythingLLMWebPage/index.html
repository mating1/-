<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http: https:; img-src 'self' data:; base-uri 'self'">
<title>AnythingLLM Web 对话</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #1e1e2e; color: #cdd6f4; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; background: #181825; border-bottom: 1px solid #313244; font-size: 16px; font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 72%; margin-bottom: 14px; padding: 10px 14px; border-radius: 10px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .user { background: #89b4fa; color: #1e1e2e; margin-left: auto; }
  .bot { background: #313244; }
  .sys { color: #6c7086; font-size: 12px; text-align: center; }
  form { display: flex; gap: 10px; padding: 14px 20px; background: #181825; border-top: 1px solid #313244; }
  input, select { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #313244; background: #1e1e2e; color: #cdd6f4; font-size: 14px; outline: none; }
  input:focus, select:focus { border-color: #89b4fa; }
  button { padding: 10px 20px; border: none; border-radius: 8px; background: #89b4fa; color: #1e1e2e; font-weight: 600; cursor: pointer; }
  button.ghost { background: #313244; color: #cdd6f4; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .cfg { padding: 10px 20px; background: #11111b; font-size: 12px; color: #6c7086; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .cfg input, .cfg select { flex: 0 1 180px; padding: 5px 8px; font-size: 12px; }
  .cfg button { padding: 5px 12px; font-size: 12px; }
  @media (max-width: 640px) {
    .msg { max-width: 92%; }
    .cfg { flex-direction: column; align-items: stretch; gap: 8px; }
    .cfg input, .cfg select { flex: 1 1 auto; }
    header { font-size: 14px; padding: 10px 14px; }
    #chat { padding: 12px; }
    form { padding: 10px 12px; gap: 8px; }
    button { padding: 10px 14px; }
  }
</style>
</head>
<body>
<header>AnythingLLM · Web 对话</header>
<div class="cfg">
  <span>Base URL:</span><input id="base" value="http://localhost:3001" maxlength="500">
  <span>API Key:</span><input id="key" type="password" placeholder="Bearer token" maxlength="200" autocomplete="off">
  <span>工作区:</span>
  <select id="slugSel"><option value="">（点击右侧加载）</option></select>
  <button id="loadWs" type="button">加载工作区</button>
  <span>或手填 slug:</span><input id="slug" placeholder="my-workspace" maxlength="100">
  <button id="newSession" type="button" class="ghost">新会话</button>
</div>
<div id="chat"><div class="sys">填写 Base URL 与 API Key，加载工作区后开始对话</div></div>
<form id="f">
  <input id="q" placeholder="输入消息…" autocomplete="off" maxlength="2000">
  <button id="send" type="submit">发送</button>
</form>
<script>
const $ = id => document.getElementById(id);
const chat = $('chat');
let sessionId = null;

function newSession() {
  sessionId = (crypto.randomUUID ? crypto.randomUUID() : 'web-' + Date.now() + '-' + Math.random().toString(16).slice(2));
}
newSession();

// 支持 ?api=<base> 覆盖默认 Base URL，结尾 /api 自动去掉。
(function applyQueryBase() {
  const p = new URLSearchParams(location.search).get('api');
  if (p) $('base').value = p.replace(/\/api\/?$/, '').replace(/\/$/, '');
})();

function normalizeBase() {
  return $('base').value.trim().replace(/\/$/, '');
}

function validHttpUrl(url) {
  return /^https?:\/\/.+/i.test(url);
}

function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function currentSlug() {
  return $('slugSel').value || $('slug').value.trim();
}

function authHeaders() {
  return { 'Authorization': 'Bearer ' + $('key').value.trim() };
}

async function loadWorkspaces() {
  const base = normalizeBase();
  if (!validHttpUrl(base)) { add('Base URL 必须是 http:// 或 https:// 开头', 'sys'); return; }
  const sel = $('slugSel');
  sel.innerHTML = '';
  try {
    const r = await fetch(`${base}/api/v1/workspaces`, { headers: authHeaders() });
    if (!r.ok) { add('加载工作区失败 HTTP ' + r.status, 'sys'); return; }
    const data = await r.json();
    const ws = data.workspaces || [];
    if (!ws.length) { add('无可用工作区', 'sys'); return; }
    ws.forEach(w => {
      const o = document.createElement('option');
      o.value = w.slug;
      o.textContent = (w.name || w.slug) + ' (' + w.slug + ')';
      sel.appendChild(o);
    });
    newSession();
    add('已加载 ' + ws.length + ' 个工作区，已开启新会话', 'sys');
  } catch (err) {
    add('加载工作区失败：' + err.message, 'sys');
  }
}

$('loadWs').addEventListener('click', loadWorkspaces);
$('slugSel').addEventListener('change', newSession);
$('newSession').addEventListener('click', () => { newSession(); add('已开启新会话', 'sys'); });

// 解析 SSE 流：逐行读取 data: 载荷，回调增量文本；返回是否拿到流内容。
async function postStream(url, body, onChunk) {
  const r = await fetch(url, {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
    body: JSON.stringify(body),
  });
  if (!r.ok || !r.body) {
    let detail = '';
    try { detail = await r.text(); } catch (_) {}
    return { ok: false, status: r.status, detail: detail };
  }
  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  let got = false;
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, idx).trim();
      buf = buf.slice(idx + 1);
      if (!line.startsWith('data:')) continue;
      const payload = line.slice(5).trim();
      if (!payload || payload === '[DONE]') continue;
      try {
        const obj = JSON.parse(payload);
        if (obj.textResponse) { onChunk(obj.textResponse); got = true; }
        if (obj.closed) { reader.cancel(); return { ok: true, got: true }; }
      } catch (_) { /* 非 JSON 心跳行忽略 */ }
    }
  }
  return { ok: true, got: got };
}

async function postJson(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
    body: JSON.stringify(body),
  });
  const text = await r.text();
  let data = {};
  try { data = JSON.parse(text); } catch (_) { data = { raw: text }; }
  return { ok: r.ok, status: r.status, data: data };
}

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('q').value.trim();
  if (!q) return;
  const slug = currentSlug();
  if (!slug) { add('请先选择工作区，或在右侧填写工作区 slug', 'sys'); return; }
  const base = normalizeBase();
  if (!validHttpUrl(base)) { add('Base URL 必须是 http:// 或 https:// 开头', 'sys'); return; }
  $('q').value = '';
  add(q, 'user');
  $('send').disabled = true;
  const botNode = add('', 'bot');
  const body = { message: q, mode: 'chat', sessionId: sessionId };
  try {
    // 优先流式（stream-chat SSE）；不支持或无增量时回退非流式 /chat。
    const stream = await postStream(`${base}/api/v1/workspace/${slug}/stream-chat`, body, chunk => {
      botNode.textContent += chunk;
      chat.scrollTop = chat.scrollHeight;
    });
    if (stream.ok && stream.got) return;

    botNode.textContent = '';
    const res = await postJson(`${base}/api/v1/workspace/${slug}/chat`, body);
    if (!res.ok) { botNode.remove(); add('HTTP ' + res.status + ': ' + (res.data.raw || JSON.stringify(res.data)), 'sys'); return; }
    botNode.textContent = res.data.textResponse || JSON.stringify(res.data);
  } catch (err) {
    botNode.remove();
    add('请求失败：' + err.message, 'sys');
  } finally {
    $('send').disabled = false;
    $('q').focus();
  }
});
</script>
</body>
</html>
